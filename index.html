<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link href="src/assets/unidorm-logo-white-bg.png" rel="icon" type="image/svg+xml" />
    <meta content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, interactive-widget=resizes-content, viewport-fit=cover" name="viewport" />
    <title>UNI Dorm : 인천대학교 기숙사 생활을 더욱 편하게!</title>
    <script>
      window.onReceiveFcmToken = function(token) {
        if (token && token.trim() !== "") {
          localStorage.setItem("fcmToken", token);
          window.dispatchEvent(new CustomEvent("fcmTokenReceived", { detail: token }));
        }
      };
    </script>
</head>
<body>
<div id="root"></div>
<script src="/src/main.tsx" type="module"></script>
</body>
</html>
